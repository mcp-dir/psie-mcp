# Smithery configuration for Consulta de Radar (PSIE/Inmetro)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_psie

name: psie-mcp
displayName: "Consulta de Radar (PSIE/Inmetro)"
description: >
  Consulta a situação metrológica dos radares e etilômetros de um município nas bases oficiais do Inmetro (PSIE), a mesma que o cidadão acessa: número de série, sentido, velocidade nominal, responsável, local, data de validade e resultado da verificação (aprovado, reprovado ou reparado). Útil pra checar se o radar que aplicou uma multa estava aprovado e dentro da validade na data da autuação. Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/psie-mcp
repository: https://github.com/mcp-dir/psie-mcp

tags:
  - psie
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_psie

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_psie/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
